# 方案A: 纯深度学习 - 用于本地推理
data_dir: ../A股数据
output_dir: outputs_scheme_a
start_date: "20180101"
end_date: "20260601"
train_end: "20241231"
val_end: auto
universe: all
seq_len: 20
label_horizon: 1

features:
  use_metric: true
  use_moneyflow: true
  use_market: true
  use_news: false
  cross_section_rank: true
  fill_missing: true

model:
  name: gru_transformer
  d_model: 96
  nhead: 4
  num_layers: 2
  dim_feedforward: 192
  head_hidden: 96
  gru_hidden: 48
  dropout: 0.22

train:
  batch_size: 1024
  epochs: 18
  lr: 0.0003
  early_stop_patience: 5
  num_workers: 4
  amp: true
  max_minutes: 330
  seed: 42

# 方案A: 纯DL，禁用LightGBM
lgbm:
  enabled: false

ensemble:
  alpha: 1.0
  alpha_grid: [1.0]

# 策略: 动态持仓（2026-06-02 反思后调整）
strategy:
  initial_cash: 1000000
  cost_rate: 0.0010        # 保守计入佣金/印花税等交易成本
  slippage: 0.0015         # 小盘股和手动下单滑点
  # 动态持仓数量：高波动少持、低波动适度多持
  adaptive_hold: true
  adaptive_hold_multi_indicator: true
  adaptive_min_hold: 24
  adaptive_max_hold: 32
  adaptive_low_vol_pct: 0.3
  adaptive_high_vol_pct: 0.7
  adaptive_vol_weight: 0.4
  adaptive_ic_weight: 0.3
  adaptive_conf_weight: 0.3
  n_hold: 30
  k_trade: 2
  k_trade_grid: [1, 2, 3, 4, 5]
  turnover_penalty: 0.005
  # 阈值触发换手：使用横截面百分位分差，避免 A/B 分数尺度不同
  score_gap_trigger: true
  score_gap_trigger_threshold: 0.05
  # 风险过滤
  risk_filter: true
  max_abs_pct_chg: 9.5
  min_amount_quantile: 0.20
  min_avg_amount_abs: 5e4     # amount单位约为千元：过滤成交额低于约5000万元
  min_list_age_years: 0.5
  max_mv_quantile: 0.95
  min_mv_quantile: 0.05
  max_ret_cut: 8.0
  momentum_filter: true
  momentum_rank_col: rank_ret_5d
  min_momentum_rank: 0.2
  # 动态 K 换手（核心修复）
  dynamic_k: true
  dynamic_k_use_rank_scores: true
  debug_dynamic_k: false
  dynamic_k_bad_min: 1
  dynamic_k_bad_buffer: 0
  dynamic_k_max: 6
  dynamic_k_step: 1
  score_gap_low: 0.02
  score_gap_high: 0.10
  # 候选外清理：只卖"烂股"（分数<候选中位 且 不在top候选）
  sell_outsiders: true
  sell_outsiders_mode: bad
  sell_outsiders_unlimited: false
  sell_outsiders_max: 2
  # 买入放大链：全部关闭（让动态 K 真正生效）
  amplify_buys: false
  hand_expand_enabled: false
  hand_expand_min_gap_pct: 0.01
  topup_enabled: false
  topup_min_gap_pct: 0.02
  topup_max_extra: 0
  topup_min_liquidity: 0.3
  topup_min_score_pct: 0.5
  topup_prefetch_codes: 0
  enforce_cash_limit: true
  # 目标仓位：高波动日主动留现金
  dynamic_position: true
  min_position_ratio: 0.70
  base_position_ratio: 0.85
  max_position_ratio: 0.92
  use_long_short: false
  cash_reserve_ratio: 0.08
  max_positions_per_industry: 5
  # 价格 slack
  sell_slack: 0.002
  buy_slack: 0.001
  limit_pct: 0.10
